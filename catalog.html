<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catalog — Flourish &amp; Blotts</title>
    <meta
      name="description"
      content="Everything on the shelves at Flourish &amp; Blotts: spell scrolls and spellbooks."
    />
    <link rel="stylesheet" href="shared/shared.css" />

    <!--
      build-config.js is a plain synchronous classic script -- deliberately not
      deferred, so window.MAGICSTORE_BUILD (if the build step generated it)
      exists before anything below reads it. It's tiny, so briefly blocking the
      parser for it is a non-issue.

      The three below are the SDK integration proper, and sit in the head so
      the 1.2 MB bundle starts downloading during head parsing; none of the
      three blocks the parser: `defer` for the classic bundle, and the two
      modules are deferred by definition. Non-async defer and module scripts
      share one queue and run in document order, so the global exists before
      webchat.js reads it, and shared.js still runs last — load-bearing, since
      shared.js's top-level await delays its `magicstore:chrome-ready` dispatch
      until after webchat.js has registered its listener for it. Swap the last
      two script tags and the chat controls go silently dead.
    -->
    <script src="shared/build-config.js"></script>
    <script defer src="vendor/connectly-webchat.js"></script>
    <script type="module" src="shared/webchat.js"></script>
    <script type="module" src="shared/shared.js"></script>
  </head>
  <body data-page="catalog">
    <div data-slot="header"></div>

    <main class="page" id="main">
      <section class="masthead">
        <p class="eyebrow eyebrow--lead">The stock book</p>
        <h1 class="masthead__title">Everything on the shelves</h1>
        <p class="masthead__lede">
          Twelve lines in stock today: six scrolls from the case by the door, six titles from the back wall. Prices are
          in Galleons and hold until the end of term.
        </p>
      </section>

      <section class="rack" aria-labelledby="rack-heading">
        <h2 class="u-sr-only" id="rack-heading">Stock list</h2>

        <div class="filters">
          <p class="filters__label" id="filters-label">Show</p>
          <div class="filters__set" role="group" aria-labelledby="filters-label">
            <button class="chip" type="button" data-action="filter" data-filter="all" aria-pressed="true">
              Everything
            </button>
            <button class="chip" type="button" data-action="filter" data-filter="spell" aria-pressed="false">
              Spell scrolls
            </button>
            <button class="chip" type="button" data-action="filter" data-filter="book" aria-pressed="false">
              Spellbooks
            </button>
          </div>
          <p class="filters__count" data-catalog-count role="status"></p>
        </div>

        <div class="rack__grid" data-catalog-grid>
          <noscript>
            <p class="rack__fallback">
              The stock list is drawn by the shop&rsquo;s script. Turn JavaScript on to browse, or ask at the counter.
            </p>
          </noscript>
        </div>
      </section>
    </main>

    <div data-slot="footer"></div>
  </body>
</html>
