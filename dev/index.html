    <!--
      shared.css is linked from public/, not imported through the bundler, because
      public/landing.html links the very same file. One unhashed stylesheet is what
      keeps the two integration demos looking like one shop.

      build-config.js is a plain synchronous classic script, generated by
      scripts/gen-build-config.mjs and gitignored. It stays a classic script for
      landing.html's sake -- that page deliberately imports nothing -- and this app
      reads the same `window.MAGICSTORE_BUILD` global so both demos are configured
      from one file. Not deferred, so the global exists before the module below runs.
    -->
    <link rel="stylesheet" href="shared/shared.css" />
    <script src="shared/build-config.js"></script>
    <script type="module" crossorigin src="./assets/index-CGfAEea0.js"></script>
  </head>
  <body data-page="app">
    <div id="magicstore-root"></div>
  </body>
</html>
