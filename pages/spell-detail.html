<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>On the shelf — Flourish &amp; Blotts</title>
    <meta name="description" content="A single line from the Flourish &amp; Blotts stock book, with casting notes." />
    <link rel="stylesheet" href="../shared/shared.css" />

    <!--
      build-config.js is a plain synchronous classic script -- deliberately not
      deferred, so window.MAGICSTORE_BUILD (if the build step generated it)
      exists before anything below reads it. It's tiny, so briefly blocking the
      parser for it is a non-issue.

      The three below are the SDK integration proper, and sit in the head so
      the 1.2 MB bundle starts downloading during head parsing; none of the
      three blocks the parser: `defer` for the classic bundle, and the two
      modules are deferred by definition. Non-async defer and module scripts
      share one queue and run in document order, so the global exists before
      webchat.js reads it, and shared.js still runs last — load-bearing, since
      shared.js's top-level await delays its `magicstore:chrome-ready` dispatch
      until after webchat.js has registered its listener for it. Swap the last
      two script tags and the chat controls go silently dead.
    -->
    <script src="../shared/build-config.js"></script>
    <script defer src="../vendor/connectly-webchat.js"></script>
    <script type="module" src="../shared/webchat.js"></script>
    <script type="module" src="../shared/shared.js"></script>
  </head>
